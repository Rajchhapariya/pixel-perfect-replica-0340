<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Deep automotive candy crimson paint gradient -->
    <linearGradient id="crest-paint" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#df1b2b" />
      <stop offset="45%" stop-color="#ba0c1a" />
      <stop offset="100%" stop-color="#6f070f" />
    </linearGradient>

    <!-- Top curvature gloss specular reflection -->
    <linearGradient id="clear-coat" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Machined edge highlight -->
    <linearGradient id="machined-rim" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.45" />
    </linearGradient>

    <!-- Subtle lettermark drop shadow for integrated depth -->
    <filter id="a-depth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0.7" stdDeviation="0.4" flood-color="#3a0205" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Base Shield Body -->
  <path d="M16 2 L28 7 L28 18 C28 24 22 29 16 31 C10 29 4 24 4 18 L4 7 Z" fill="url(#crest-paint)"/>

  <!-- Clear Coat Reflective Layer -->
  <path d="M16 2 L28 7 L28 18 C28 24 22 29 16 31 C10 29 4 24 4 18 L4 7 Z" fill="url(#clear-coat)"/>

  <!-- White Angular "A" Lettermark (Centered at x=16.0, with subtle physical depth) -->
  <path d="M 14.5 9.5 L 17.5 9.5 L 22.5 23 L 19.4 23 L 18.2 19.5 L 13.8 19.5 L 12.6 23 L 9.5 23 Z M 16.0 12.6 L 14.3 17.0 L 17.7 17.0 Z" fill="#ffffff" fill-rule="evenodd" filter="url(#a-depth)"/>

  <!-- Precision Machined Outer Bevel Rim -->
  <path d="M16 2 L28 7 L28 18 C28 24 22 29 16 31 C10 29 4 24 4 18 L4 7 Z" fill="none" stroke="url(#machined-rim)" stroke-width="1"/>
</svg>